<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Stock Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');

  :root {
    --bg:        #0a0e17;
    --surface:   #111827;
    --border:    #1f2d3d;
    --accent:    #00e5ff;
    --up:        #00e676;
    --down:      #ff1744;
    --neutral:   #607d8b;
    --text:      #e8f0fe;
    --muted:     #546e7a;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Noto Sans JP', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ─── HEADER ─── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--accent);
  }
  .logo span { color: var(--muted); font-weight: 400; }

  /* ─── FX TICKER ─── */
  .fx-block {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 13px;
  }
  .fx-label { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .fx-rate  { font-size: 22px; font-weight: 700; color: var(--accent); }
  .fx-sub   { font-size: 11px; color: var(--muted); }
  .fx-blink { animation: blink .6s ease-out; }
  @keyframes blink {
    0%   { color: #fff; }
    100% { color: var(--accent); }
  }

  /* ─── AUTO-REFRESH STATUS ─── */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--neutral);
  }
  .dot.live { background: var(--up); animation: pulse 2s infinite; }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: .3; }
  }

  /* ─── MAIN ─── */
  main {
    flex: 1;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
  }

  /* ─── ADD FORM ─── */
  .add-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .add-row input {
    flex: 1;
    max-width: 240px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 6px;
    text-transform: uppercase;
    outline: none;
    transition: border-color .2s;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row input::placeholder { color: var(--muted); text-transform: none; }

  .btn {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-add  { background: var(--accent); color: #000; }
  .btn-add:hover { opacity: .85; }
  .btn-del  {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 16px;
    padding: 4px 10px;
    line-height: 1;
  }
  .btn-del:hover { border-color: var(--down); color: var(--down); }

  .hint { font-size: 12px; color: var(--muted); }

  /* ─── CARD GRID ─── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    transition: border-color .3s;
  }
  .card.up-flash   { border-color: var(--up);   box-shadow: 0 0 12px rgba(0,230,118,.15); }
  .card.down-flash { border-color: var(--down);  box-shadow: 0 0 12px rgba(255,23,68,.15); }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .ticker-sym {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--text);
  }
  .ticker-name {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .price-block {
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }
  .price-usd {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }
  .price-usd.up   { color: var(--up); }
  .price-usd.down { color: var(--down); }
  .price-usd.flat { color: var(--text); }

  .price-jpy {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    padding-bottom: 4px;
  }

  .change-row {
    display: flex;
    gap: 10px;
    font-family: var(--mono);
    font-size: 13px;
  }
  .badge {
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 600;
  }
  .badge.up   { background: rgba(0,230,118,.12); color: var(--up); }
  .badge.down { background: rgba(255,23,68,.12);  color: var(--down); }
  .badge.flat { background: rgba(96,125,139,.12); color: var(--neutral); }

  .meta-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
  }
  .meta-item span { display: block; font-family: var(--mono); color: var(--text); font-size: 13px; margin-top: 1px; }

  .loading-shimmer {
    background: linear-gradient(90deg, var(--border) 25%, #1a2840 50%, var(--border) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
    height: 28px;
  }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  .updated-at {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    margin-top: auto;
  }

  /* ─── EMPTY ─── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .big { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* ─── TOAST ─── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(10px);
    transition: all .3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: var(--down); color: var(--down); }

  /* ─── FOOTER ─── */
  footer {
    text-align: center;
    padding: 14px;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }

  @media (max-width: 500px) {
    header { padding: 12px 16px; }
    main   { padding: 16px; }
    .fx-rate { font-size: 18px; }
    .card-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">US<span>stock</span>WATCH</div>

  <div class="fx-block">
    <div>
      <div class="fx-label">USD / JPY</div>
      <div class="fx-rate" id="fxRate">—</div>
      <div class="fx-sub" id="fxUpdated">取得中...</div>
    </div>
  </div>

  <div class="status-bar">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">待機中</span>
  </div>
</header>

<main>
  <div class="add-row">
    <input id="tickerInput" type="text" placeholder="ティッカー例: AAPL, TSLA, NVDA" maxlength="10">
    <button class="btn btn-add" onclick="addTicker()">＋ 追加</button>
    <span class="hint" id="countHint"></span>
  </div>

  <div class="card-grid" id="cardGrid"></div>
</main>

<div class="toast" id="toast"></div>

<footer>データ取得: Yahoo Finance (非公式 API) ／ 為替: Open Exchange Rates 互換 ／ 自動更新: 30秒</footer>

<!-- ─── SCRIPT ─── -->
<script>
const MAX_TICKERS = 8;
const REFRESH_MS  = 30000;
const STORAGE_KEY = 'usstock_tickers';

// CORS プロキシ（無料）
const PROXY = 'https://corsproxy.io/?';

let fxRate   = null;
let tickers  = [];
let stockData = {};
let refreshTimer = null;

// ─── 初期化 ─────────────────────────────────────
function init() {
  const saved = localStorage.getItem(STORAGE_KEY);
  tickers = saved ? JSON.parse(saved) : ['AAPL', 'NVDA', 'TSLA', 'MSFT', 'AMZN'];
  renderCards();
  fetchAll();
  refreshTimer = setInterval(fetchAll, REFRESH_MS);
}

// ─── 保存 ────────────────────────────────────────
function saveTickers() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tickers));
}

// ─── 為替取得 ────────────────────────────────────
async function fetchFX() {
  try {
    // exchangerate-api (無料・CORS OK)
    const url = `${PROXY}${encodeURIComponent('https://open.er-api.com/v6/latest/USD')}`;
    const res  = await fetch(url);
    const data = await res.json();
    if (data.rates && data.rates.JPY) {
      fxRate = data.rates.JPY;
      const el = document.getElementById('fxRate');
      el.textContent = fxRate.toFixed(2) + ' 円';
      el.classList.remove('fx-blink');
      void el.offsetWidth;
      el.classList.add('fx-blink');
      document.getElementById('fxUpdated').textContent = '更新: ' + nowStr();
    }
  } catch(e) {
    document.getElementById('fxUpdated').textContent = '取得失敗';
  }
}

// ─── 株価取得 (Yahoo Finance v8) ─────────────────
async function fetchStock(sym) {
  const url = `${PROXY}${encodeURIComponent(
    `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=1d`
  )}`;
  const res  = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  const meta = json.chart.result[0].meta;
  return {
    symbol:        meta.symbol,
    shortName:     meta.shortName || meta.symbol,
    price:         meta.regularMarketPrice,
    prevClose:     meta.chartPreviousClose || meta.previousClose,
    open:          meta.regularMarketOpen || null,
    dayHigh:       meta.regularMarketDayHigh || null,
    dayLow:        meta.regularMarketDayLow  || null,
    volume:        meta.regularMarketVolume  || null,
    currency:      meta.currency || 'USD',
  };
}

// ─── 全データ取得 ────────────────────────────────
async function fetchAll() {
  setStatus('loading');
  await fetchFX();
  await Promise.allSettled(tickers.map(async sym => {
    try {
      const d = await fetchStock(sym);
      stockData[sym] = { ...d, error: false, updatedAt: nowStr() };
    } catch(e) {
      if (!stockData[sym]) stockData[sym] = { symbol: sym, error: true };
    }
    renderCard(sym);
  }));
  setStatus('live');
}

// ─── ステータス表示 ──────────────────────────────
function setStatus(s) {
  const dot  = document.getElementById('statusDot');
  const txt  = document.getElementById('statusText');
  if (s === 'live') {
    dot.className = 'dot live';
    txt.textContent = '監視中 (30秒更新)';
  } else {
    dot.className = 'dot';
    txt.textContent = '更新中...';
  }
}

// ─── カード全描画 ────────────────────────────────
function renderCards() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  if (tickers.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="big">📈</div>
      <p>上のフォームからティッカーを追加してください</p>
    </div>`;
    updateHint();
    return;
  }
  tickers.forEach(sym => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${sym}`;
    card.innerHTML = shimmerHTML(sym);
    grid.appendChild(card);
  });
  updateHint();
}

function shimmerHTML(sym) {
  return `
    <div class="card-header">
      <div><div class="ticker-sym">${sym}</div></div>
      <button class="btn btn-del" onclick="removeTicker('${sym}')" title="削除">×</button>
    </div>
    <div class="loading-shimmer"></div>
    <div class="loading-shimmer" style="height:14px;width:60%"></div>`;
}

// ─── 個別カード描画 ──────────────────────────────
function renderCard(sym) {
  const el = document.getElementById(`card-${sym}`);
  if (!el) return;
  const d = stockData[sym];

  if (!d || d.error) {
    el.innerHTML = `
      <div class="card-header">
        <div><div class="ticker-sym">${sym}</div><div class="ticker-name" style="color:var(--down)">取得失敗</div></div>
        <button class="btn btn-del" onclick="removeTicker('${sym}')">×</button>
      </div>
      <div style="font-size:12px;color:var(--muted)">ティッカーを確認してください</div>`;
    return;
  }

  const chg    = d.price - d.prevClose;
  const chgPct = (chg / d.prevClose * 100);
  const dir    = chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat';
  const sign   = chg > 0 ? '+' : '';
  const jpyStr = fxRate ? `≈ ${Math.round(d.price * fxRate).toLocaleString()} 円` : '';

  const vol = d.volume
    ? (d.volume >= 1e6 ? (d.volume/1e6).toFixed(1)+'M' : (d.volume/1e3).toFixed(0)+'K')
    : '—';

  el.className = `card ${dir}-flash`;
  setTimeout(() => { if(el) el.className = 'card'; }, 1200);

  el.innerHTML = `
    <div class="card-header">
      <div>
        <div class="ticker-sym">${sym}</div>
        <div class="ticker-name">${d.shortName}</div>
      </div>
      <button class="btn btn-del" onclick="removeTicker('${sym}')">×</button>
    </div>

    <div class="price-block">
      <div class="price-usd ${dir}">$${d.price.toFixed(2)}</div>
      <div class="price-jpy">${jpyStr}</div>
    </div>

    <div class="change-row">
      <span class="badge ${dir}">${sign}${chg.toFixed(2)}</span>
      <span class="badge ${dir}">${sign}${chgPct.toFixed(2)}%</span>
    </div>

    <div class="meta-row">
      <div class="meta-item">始値<span>$${d.open ? d.open.toFixed(2) : '—'}</span></div>
      <div class="meta-item">前日終値<span>$${d.prevClose.toFixed(2)}</span></div>
      <div class="meta-item">高値<span>$${d.dayHigh ? d.dayHigh.toFixed(2) : '—'}</span></div>
      <div class="meta-item">安値<span>$${d.dayLow ? d.dayLow.toFixed(2) : '—'}</span></div>
    </div>

    <div class="updated-at">更新: ${d.updatedAt}　Vol: ${vol}</div>`;
}

// ─── 追加 ────────────────────────────────────────
async function addTicker() {
  const inp = document.getElementById('tickerInput');
  const sym = inp.value.trim().toUpperCase().replace(/[^A-Z.]/g,'');
  if (!sym) { showToast('ティッカーを入力してください', true); return; }
  if (tickers.includes(sym)) { showToast(`${sym} は追加済みです`, true); return; }
  if (tickers.length >= MAX_TICKERS) {
    showToast(`最大${MAX_TICKERS}銘柄まで登録できます`, true); return;
  }
  tickers.push(sym);
  saveTickers();
  inp.value = '';
  renderCards();
  // 追加した銘柄だけ即取得
  try {
    const d = await fetchStock(sym);
    stockData[sym] = { ...d, error: false, updatedAt: nowStr() };
  } catch(e) {
    stockData[sym] = { symbol: sym, error: true };
  }
  renderCard(sym);
  showToast(`${sym} を追加しました`);
  updateHint();
}

// ─── 削除 ────────────────────────────────────────
function removeTicker(sym) {
  tickers = tickers.filter(s => s !== sym);
  delete stockData[sym];
  saveTickers();
  renderCards();
  tickers.forEach(s => { if(stockData[s]) renderCard(s); });
  showToast(`${sym} を削除しました`);
}

// ─── ヒント更新 ──────────────────────────────────
function updateHint() {
  document.getElementById('countHint').textContent =
    `${tickers.length} / ${MAX_TICKERS} 銘柄`;
}

// ─── トースト ────────────────────────────────────
function showToast(msg, isErr=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'toast show' + (isErr ? ' error' : '');
  setTimeout(() => { el.className = 'toast'; }, 2800);
}

// ─── Enter キー ──────────────────────────────────
document.getElementById('tickerInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTicker();
});

// ─── 時刻 ────────────────────────────────────────
function nowStr() {
  return new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

// ─── 起動 ────────────────────────────────────────
init();
</script>
</body>
</html>
